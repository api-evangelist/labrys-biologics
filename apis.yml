name: Labrys Biologics
description: 'Labrys Biologics was a clinical-stage biopharmaceutical company founded in 2012
  and headquartered in San Mateo, California, developing monoclonal antibody therapeutics
  targeting calcitonin gene-related peptide (CGRP) for the prevention of chronic and episodic
  migraine. The company was venture-backed, with Canaan Partners among its investors, and was
  acquired by Teva Pharmaceutical Industries in 2014, after which its lead anti-CGRP antibody
  program continued under Teva. Labrys Biologics no longer operates as an independent company
  and maintains no developer or API surface: enrichment probes on 2026-07-19 found the
  registrant domain labrysbiologics.com resolving but serving nothing (TCP 80 and 443 closed),
  delegated to Teva nameservers, with a no-mail SPF/DMARC lockdown and no GitHub organization.
  This profile is retained as a historical portfolio-company record rather than an API listing.'
